name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm test
      - run: npm run check:demo
      - run: npm run check:public
  browser-workflows:
    name: browser workflow gates (real Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Both hosted Chrome journeys passed at 4b48a83; subsequent failures block CI.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Playwright outside the repo (the repo itself has no dependencies)
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cp ci/package.json ci/package-lock.json "$RUNNER_TEMP/pw/"
          npm ci --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund
      - run: PLAYWRIGHT_DIR="$RUNNER_TEMP/pw/node_modules" CHROME_PATH=/usr/bin/google-chrome npm run test:decision-outcomes
      - run: PLAYWRIGHT_DIR="$RUNNER_TEMP/pw/node_modules" CHROME_PATH=/usr/bin/google-chrome npm run test:break-it
      - run: PLAYWRIGHT_DIR="$RUNNER_TEMP/pw/node_modules" CHROME_PATH=/usr/bin/google-chrome npm run test:try-it
      - run: PLAYWRIGHT_DIR="$RUNNER_TEMP/pw/node_modules" CHROME_PATH=/usr/bin/google-chrome npm run test:attack
      - run: PLAYWRIGHT_DIR="$RUNNER_TEMP/pw/node_modules" CHROME_PATH=/usr/bin/google-chrome npm run test:stage-freeze
      - run: PLAYWRIGHT_DIR="$RUNNER_TEMP/pw/node_modules" CHROME_PATH=/usr/bin/google-chrome npm run test:vision
      - run: PLAYWRIGHT_DIR="$RUNNER_TEMP/pw/node_modules" CHROME_PATH=/usr/bin/google-chrome npm run test:reanalysis
      - run: PLAYWRIGHT_DIR="$RUNNER_TEMP/pw/node_modules" AXE_PATH="$RUNNER_TEMP/pw/node_modules/axe-core/axe.min.js" CHROME_PATH=/usr/bin/google-chrome npm run test:a11y
      - run: PLAYWRIGHT_DIR="$RUNNER_TEMP/pw/node_modules" CHROME_PATH=/usr/bin/google-chrome npm run test:bundle-origin
      - run: PLAYWRIGHT_DIR="$RUNNER_TEMP/pw/node_modules" OIDC_PROVIDER_DIR="$RUNNER_TEMP/pw" CHROME_PATH=/usr/bin/google-chrome npm run test:idp-interop
      - run: PLAYWRIGHT_DIR="$RUNNER_TEMP/pw/node_modules" CHROME_PATH=/usr/bin/google-chrome npm run test:e2e
      - run: PLAYWRIGHT_DIR="$RUNNER_TEMP/pw/node_modules" CHROME_PATH=/usr/bin/google-chrome npm run test:demo-vision
  browser-webkit:
    name: manual workflow (WebKit)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install pinned Playwright and its WebKit build
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cp ci/package.json ci/package-lock.json "$RUNNER_TEMP/pw/"
          npm ci --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps webkit
      - run: PLAYWRIGHT_DIR="$RUNNER_TEMP/pw/node_modules" BROWSER=webkit npm run test:e2e
