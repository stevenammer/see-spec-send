name: OpenSSF Scorecard
# A public, weekly score of how this repository handles supply-chain safety. Results go to the
# Security tab and to the badge in the README.
on:
  push: { branches: [main] }
  schedule: [{ cron: '17 6 * * 3' }]
  branch_protection_rule:
permissions: read-all
jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@b7b84b636b4f90c9b31da1bc5f72bfadd5b31410 # v3
        with: { sarif_file: results.sarif }
