# Optional streaming replication. Use it on top of compose.yaml:
#   docker compose -f compose.yaml -f compose.streaming.yaml up -d
# Litestream ships the database's write-ahead log to the replica about once a second. Point deploy/litestream.yml at
# storage on separate hardware before relying on it. Read docs/HA.md first, including what it does to erasure.
services:
  litestream:
    image: litestream/litestream:0.3.13@sha256:027eda2a89a86015b9797d2129d4dd447e8953097b4190e1d5a30b73e76d8d58
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp"]
    command: ["replicate"]
    volumes:
      - sss-data:/data
      - replica-data:/replica
      - ./deploy/litestream.yml:/etc/litestream.yml:ro
    depends_on: [server]
    restart: unless-stopped
volumes:
  replica-data:
