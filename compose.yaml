services:
  server:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app:ro
      - sss-data:/data
    environment:
      SSS_DB: /data/sss.db
    command: ["node", "cli.js", "serve", "--port", "8787", "--host", "0.0.0.0", "--origin", "http://127.0.0.1:8787", "--insecure-cookies"]
    ports: ["8787:8787"]
  worker:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app:ro
      - sss-data:/data
    environment:
      SSS_DB: /data/sss.db
    command: ["node", "cli.js", "worker"]
  watchdog:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./:/app:ro
      - sss-data:/data
    environment:
      SSS_DB: /data/sss.db
    command: ["sh", "-c", "while true; do node cli.js watchdog; sleep 10; done"]
volumes:
  sss-data:
