# One supported network path: the TLS front end below terminates HTTPS and shares the server's network namespace,
# so its connection to the server is loopback and the server's --trusted-proxy rule applies to it.
# Before `docker compose up`, set SSS_ORIGIN (the public https origin) and SSS_TLS_IMAGE (nginxinc/nginx-unprivileged,
# pinned by digest). Compose refuses to start until both are set. The node image digest is the one in worker/builder-image.digest.
services:
  server:
    image: node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
    working_dir: /app
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - ./:/app:ro
      - sss-data:/data
    environment:
      SSS_DB: /data/sss.db
    command: ["node", "cli.js", "serve", "--port", "8787", "--host", "0.0.0.0", "--origin", "${SSS_ORIGIN:?set SSS_ORIGIN to the public https origin}", "--trusted-proxy"]
    ports: ["127.0.0.1:8443:8443"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/signin').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  tls:
    image: ${SSS_TLS_IMAGE:?set SSS_TLS_IMAGE to nginxinc/nginx-unprivileged pinned by digest}
    network_mode: "service:server"
    user: "101"
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx"]
    volumes:
      - ./deploy/tls-front.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/sss/tls:ro
    depends_on: [server]
    restart: unless-stopped
  worker:
    image: node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
    working_dir: /app
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - ./:/app:ro
      - sss-data:/data
    environment:
      SSS_DB: /data/sss.db
    command: ["node", "cli.js", "worker"]
    restart: unless-stopped
  watchdog:
    image: node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
    working_dir: /app
    user: "1000:1000"
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - ./:/app:ro
      - sss-data:/data
    environment:
      SSS_DB: /data/sss.db
    command: ["sh", "-c", "while true; do node cli.js watchdog; sleep 10; done"]
    restart: unless-stopped
volumes:
  sss-data:
