# TLS front end for See / Spec / Send. Shares the server's network namespace (compose: network_mode service:server),
# so proxy_pass reaches the server over loopback, which is the only peer the server believes for X-Forwarded-For.
# Certificates go in deploy/tls/ as fullchain.pem and privkey.pem (never committed).
server_tokens off;
client_max_body_size 320k;

server {
  listen 8443 ssl;
  ssl_certificate /etc/sss/tls/fullchain.pem;
  ssl_certificate_key /etc/sss/tls/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;

  location / {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Appends the address this hop saw. The server reads the rightmost entry, so a client's own header cannot choose it.
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;
  }
}
